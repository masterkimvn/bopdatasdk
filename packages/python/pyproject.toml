[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bop-data-sdk"
version = "1.0.0"
description = "Read-only Python client for BOP Data public structured datasets"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Phạm Hoàng Đức (Master Kim)"}]
keywords = ["bop-data", "datasets", "structured-data", "csv"]
classifiers = [
 "Programming Language :: Python :: 3",
 "License :: OSI Approved :: MIT License",
 "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://data.bop.ink"
Source = "https://github.com/masterkimvn/bopdatasdk"
Issues = "https://github.com/masterkimvn/bopdatasdk/issues"

[tool.setuptools.package-data]
bop_data = ["py.typed"]
