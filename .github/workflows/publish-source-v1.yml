name: Publish GitHub source v1.0.0

# One-time publication of the repository source snapshot after the normal
# CI workflow has passed for the current main-branch commit.
# Does not publish npm/PyPI/Composer/other language packages.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: bop-data-sdk-source-release-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'masterkimvn/bopdatasdk' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exactly the successful CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Create v1.0.0 GitHub source release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$EXPECTED_SHA" != "$MAIN_SHA" ]]; then
            echo "Skip: a newer main commit exists. Wait for its successful CI run."
            exit 0
          fi

          test "$(cat VERSION)" = "1.0.0"
          test -s CHANGELOG.md
          test -s docs/releases/v1.0.0.md
          test -s AGENTS.md

          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub source release v1.0.0 already exists. No action."
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" >/dev/null 2>&1; then
            echo "::error::Tag v1.0.0 exists but no release was found. Review tag manually."
            exit 1
          fi

          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$EXPECTED_SHA" \
            --title "BOP Data SDK v1.0.0 — GitHub Source Release" \
            --notes-file docs/releases/v1.0.0.md \
            --latest

          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url
