name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
      - run: npm --prefix packages/javascript test && npm --prefix packages/javascript run build
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: PYTHONPATH=packages/python/src python -m unittest discover -s packages/python -v
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: curl
      - run: |
          php -S 127.0.0.1:18764 tests/server.php > /tmp/bop-php-server.log 2>&1 &
          sleep 1
          php -d zend.assertions=1 -d assert.exception=1 packages/php/test.php
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.21', '1.22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '${{ matrix.go }}'
      - run: go test ./... && go vet ./...
        working-directory: packages/go
  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: python -m pip install build
      - run: bash tests/consumer.sh

  ruby:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.1', '3.3']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '${{ matrix.ruby }}'
      - run: ruby packages/ruby/test/client_test.rb
      - run: gem build bop_data_sdk.gemspec
        working-directory: packages/ruby
  native-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: |
          gcc -Wall -Wextra -Werror examples/c/dataset.c -lcurl -o /tmp/bop-c
          g++ -std=c++17 -Wall -Wextra -Werror examples/cpp/dataset.cpp -lcurl -o /tmp/bop-cpp
          /tmp/bop-c 'bad/id' json && exit 1 || test $? -eq 2
          /tmp/bop-cpp 'bad/id' json && exit 1 || test $? -eq 2
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: mvn -B test package
        working-directory: packages/java
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test && cargo package --allow-dirty
        working-directory: packages/rust
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project ContractTests/ContractTests.csproj && dotnet pack BopData/BopData.csproj
        working-directory: packages/dotnet
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get && dart analyze && dart test
        working-directory: packages/dart
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: examples/flutter
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y kotlin libandroid-json-java
      - run: |
          kotlinc packages/kotlin/src/main/kotlin/ink/bop/data/BopDataClient.kt -cp /usr/share/java/com.android.json.jar -d /tmp/bop-kotlin.jar
          kotlinc packages/kotlin/src/test/kotlin/Smoke.kt -cp /tmp/bop-kotlin.jar:/usr/share/java/com.android.json.jar -d /tmp/bop-test.jar
          php -S 127.0.0.1:18765 tests/server.php >/tmp/bop-server.log 2>&1 &
          sleep 1
          kotlin -cp /tmp/bop-test.jar:/tmp/bop-kotlin.jar:/usr/share/java/com.android.json.jar SmokeKt
