name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix packages/javascript test && npm --prefix packages/javascript run build
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=packages/python/src python -m unittest discover -s packages/python -v
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -S 127.0.0.1:18764 tests/server.php > /tmp/bop-php-server.log 2>&1 &
          sleep 1
          php -d zend.assertions=1 -d assert.exception=1 packages/php/test.php
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./... && go vet ./...
        working-directory: packages/go
