name: Publish Rust SDK to crates.io
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH after creating crates.io API credentials and confirming name
        required: true
        type: string
permissions:
  contents: read
jobs:
  crates:
    if: github.repository == 'masterkimvn/bopdatasdk' && github.ref == 'refs/heads/main' && inputs.confirm == 'PUBLISH'
    environment: registry-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and inspect crate
        working-directory: packages/rust
        run: |
          cargo test
          cargo package --allow-dirty
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        working-directory: packages/rust
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "CRATES_IO_TOKEN missing"; exit 1; }
          cargo publish
